services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fanora-app
    container_name: fanora-app
    working_dir: /var/www/html
    volumes:
      # Code and public assets are baked into the image.
      # Storage uses a named volume (no 9p host bind-mount — those go ENODEV
      # after a Docker Desktop restart and break `docker compose up`).
      - fanora_storage:/var/www/html/storage/app/private
    environment: &app_env
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_KEY=${APP_KEY:-base64:placeholder}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=fanora
      - DB_USERNAME=fanora
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FILESYSTEM_DISK=local
      - APP_SEED_ON_BOOT=${APP_SEED_ON_BOOT:-true}
    depends_on:
      - mysql
      - redis
    networks:
      - fanora
    command: >
      sh -c "if [ -z \"$$APP_KEY\" ] || [ \"$$APP_KEY\" = \"base64:placeholder\" ]; then php artisan key:generate --force; fi;
      until php artisan migrate --force --no-interaction 2>/dev/null; do sleep 3; done;
      php artisan migrate --force --no-interaction;
      php artisan optimize:clear --no-interaction;
      if [ \"$$APP_SEED_ON_BOOT\" = \"true\" ]; then php artisan db:seed --force --no-interaction; fi;
      chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache;
      php-fpm"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://nginx:80/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  queue:
    image: fanora-app
    container_name: fanora-queue
    working_dir: /var/www/html
    depends_on:
      - app
    networks:
      - fanora
    environment: &app_env
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_KEY=${APP_KEY:-base64:placeholder}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=fanora
      - DB_USERNAME=fanora
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FILESYSTEM_DISK=local
    volumes:
      - fanora_storage:/var/www/html/storage/app/private
    command: >
      sh -c "until php artisan migrate:status --no-interaction >/dev/null 2>&1; do sleep 3; done;
      php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600"

  scheduler:
    image: fanora-app
    container_name: fanora-scheduler
    working_dir: /var/www/html
    depends_on:
      - app
    networks:
      - fanora
    environment: *app_env
    volumes:
      - fanora_storage:/var/www/html/storage/app/private
    command: >
      sh -c "until php artisan migrate:status --no-interaction >/dev/null 2>&1; do sleep 3; done;
      php artisan schedule:work --no-interaction"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    image: fanora-nginx
    container_name: fanora-nginx
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - fanora

  mysql:
    image: mysql:8.0
    container_name: fanora-mysql
    environment:
      MYSQL_DATABASE: fanora
      MYSQL_USER: fanora
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33060:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fanora
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: fanora-redis
    networks:
      - fanora

volumes:
  mysql_data:
  fanora_storage:

networks:
  fanora:
    driver: bridge