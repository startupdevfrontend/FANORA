services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fanora-app
    container_name: fanora-app
    working_dir: /var/www/html
    volumes:
      # Code is baked into the image (Dockerfile COPY . .). Only persistent
      # storage is bind-mounted.
      # NOTE: bind-mounting the full project (.:/var/www/html) over the 9p
      # filesystem is unusably slow on Docker Desktop; keep it out. nginx also
      # has its own baked image (docker/nginx.Dockerfile) so no host mounts are
      # involved at all (9p mounts can go ENODEV after a Docker Desktop restart).
      - ./docker/storage:/var/www/html/storage/app/private
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_KEY=${APP_KEY:-base64:placeholder}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=fanora
      - DB_USERNAME=fanora
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FILESYSTEM_DISK=local
    depends_on:
      - mysql
      - redis
    networks:
      - fanora
    command: >
      sh -c "if [ -z \"$$APP_KEY\" ] || [ \"$$APP_KEY\" = \"base64:placeholder\" ]; then php artisan key:generate --force; fi;
      until php artisan migrate --force --no-interaction 2>/dev/null; do sleep 3; done;
      php artisan migrate --force --no-interaction;
      php artisan optimize:clear --no-interaction;
      php artisan db:seed --force --no-interaction;
      php artisan storage:link --force;
      chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache;
      php-fpm"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    image: fanora-nginx
    container_name: fanora-nginx
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - fanora

  mysql:
    image: mysql:8.0
    container_name: fanora-mysql
    environment:
      MYSQL_DATABASE: fanora
      MYSQL_USER: fanora
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33060:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fanora
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: fanora-redis
    networks:
      - fanora

volumes:
  mysql_data:

networks:
  fanora:
    driver: bridge